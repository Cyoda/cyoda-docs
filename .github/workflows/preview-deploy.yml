name: 🚀 Deploy Preview Site

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (leave empty to use current branch)'
        required: false
        default: ''
      environment_name:
        description: 'Custom environment name (optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: "preview-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview-url: ${{ env.SURGE_URL }}
      branch-name: ${{ steps.branch-info.outputs.branch-name }}
    steps:
      - name: Harden the runner (audit mode)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Get branch info
        id: branch-info
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_ENV_NAME: ${{ github.event.inputs.environment_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Determine which branch to use
          BRANCH_NAME="$INPUT_BRANCH"
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="$REF_NAME"
          fi

          # Use custom environment name if provided, otherwise use branch name
          if [ -n "$INPUT_ENV_NAME" ]; then
            ENV_NAME="$INPUT_ENV_NAME"
          else
            ENV_NAME="$BRANCH_NAME"
          fi

          # Sanitize environment name for URL
          CLEAN_ENV=$(echo "$ENV_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g' | tr '[:upper:]' '[:lower:]')
          SURGE_DOMAIN="cyoda-docs-${CLEAN_ENV}.surge.sh"
          SURGE_URL="https://$SURGE_DOMAIN"

          echo "branch-name=$CLEAN_ENV" >> $GITHUB_OUTPUT
          echo "original-branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "SURGE_URL=$SURGE_URL" >> $GITHUB_ENV
          echo "Environment: $CLEAN_ENV (from branch: $BRANCH_NAME)"
          echo "🔧 Will build and deploy to: $SURGE_URL"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers for Mermaid rendering and testing
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: false
          CI: true

      - name: Build site with Astro
        run: |
          echo "🔧 Building with SITE_URL: ${{ env.SURGE_URL }}"
          pnpm run build
        env:
          NODE_ENV: production
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          SITE_URL: ${{ env.SURGE_URL }}
          CI: true

      - name: Run node:test + Playwright (GDPR, GA, navigators, build integration)
        run: |
          echo "🧪 Running node:test + Playwright"
          pnpm test
        env:
          NODE_ENV: production
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          SITE_URL: ${{ env.SURGE_URL }}
          CI: true

      - name: Deploy to Surge
        env:
          ENV_NAME: ${{ steps.branch-info.outputs.branch-name }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          SURGE_DOMAIN="cyoda-docs-${ENV_NAME}.surge.sh"
          echo "🚀 Deploying to: ${SURGE_URL}"
          pnpm dlx surge@0.27.4 ./dist "$SURGE_DOMAIN" --token "$SURGE_TOKEN"

      - name: Output deployment info
        run: |
          echo "🚀 **Preview deployed successfully to Surge.sh!**"
          echo ""
          echo "📍 Preview URL: ${{ env.SURGE_URL }}"
          echo ""
          echo "📝 Details:"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Commit: ${{ github.sha }}"
          echo "- Environment: ${{ steps.branch-info.outputs.branch-name }}"
          echo ""
          echo "🔍 Test your changes:"
          echo "- Homepage: ${{ env.SURGE_URL }}"
          echo "- API Reference: ${{ env.SURGE_URL }}/api-docs.html"
          echo "- Documentation: ${{ env.SURGE_URL }}/docs/"
          echo "- Cloud Status: ${{ env.SURGE_URL }}/docs/cloud/status/"

      - name: Output preview info
        run: |
          echo "🚀 Preview deployed to: ${{ steps.deploy.outputs.page_url }}"
          echo "📝 Branch: ${{ github.ref_name }}"
          echo "📦 Commit: ${{ github.sha }}"
